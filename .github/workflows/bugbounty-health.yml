name: Bug bounty - cloud health

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Bug bounty - change monitor
      - Bug bounty - HackerOne outcome sync
      - Bug bounty - static scan
      - Bug bounty - target discovery
      - Bug bounty - evidence worker
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: zerotoone-bugbounty-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check workflow state and actual execution freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node system/bugbounty-scanner/cloud-workflow-health.mjs --operational-only
