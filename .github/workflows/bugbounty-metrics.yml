name: Bug bounty - operations metrics

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Bug bounty - change monitor
      - Bug bounty - evidence worker
    types: [completed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: zerotoone-bugbounty-writer
  cancel-in-progress: false

jobs:
  metrics:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Configure automation identity
        run: |
          git config user.name "ZeroToOne Metrics"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Measure coverage and latency
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node system/bugbounty-scanner/metrics-runner.mjs

      - name: Assert the published worktree is clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
